<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Circle Fill -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Water/Aquifer Gradient -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Strata Clay Layer Gradient -->
    <linearGradient id="clayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Outer Telemetry Ring -->
  <circle cx="60" cy="60" r="56" stroke="#0e7490" stroke-width="2" stroke-dasharray="6 3" opacity="0.6"/>
  <circle cx="60" cy="60" r="52" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Compass / Telemetry Tick Marks -->
  <line x1="60" y1="10" x2="60" y2="15" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="105" x2="60" y2="110" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="10" y1="60" x2="15" y2="60" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="105" y1="60" x2="110" y2="60" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

  <!-- Top Ground / Infrastructure Surface Layer (Normal Elevation) -->
  <path d="M26 44 Q 60 41 94 44 L 94 54 Q 60 52 26 54 Z" fill="#94a3b8"/>

  <!-- Sunken Depressed Center Contour (Subsidence Cone) -->
  <path d="M30 52 Q 60 66 90 52 L 90 62 Q 60 74 30 62 Z" fill="url(#clayGrad)"/>

  <!-- Aquifer / Saturated Sand & Water Depletion Layer -->
  <path d="M34 62 Q 60 74 86 62 L 86 76 Q 60 88 34 76 Z" fill="url(#waterGrad)"/>

  <!-- Bottom Bedrock Baseline -->
  <path d="M38 76 Q 60 88 82 76 L 82 84 Q 60 94 38 84 Z" fill="#334155"/>

  <!-- Central Downward Subsidence Arrow Vector (Indicating Elevation Loss) -->
  <g transform="translate(60, 48)">
    <line x1="0" y1="0" x2="0" y2="24" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <polyline points="-5,18 0,25 5,18" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Left Coastal Wave Pulse -->
  <path d="M22 66 Q 26 62 30 66" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M20 72 Q 25 68 30 72" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- Right Radar Telemetry Signal Arc -->
  <path d="M92 38 A 42 42 0 0 1 100 60" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" stroke-dasharray="3 3"/>
  <circle cx="95" cy="36" r="2.5" fill="#38bdf8"/>
</svg>
